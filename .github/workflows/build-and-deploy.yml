name: Build and Deploy

# Builds every documentation version listed in `_static/switcher.json` on
# `main`, each from its docs branch against the Ginkgo ref pinned in that
# branch's `.ginkgo-ref`, and deploys them together to GitHub Pages.
# Only `main` deploys (the github-pages environment allows no other
# branch): pushes to `develop` and `release/**` dispatch this workflow via
# `trigger-deploy.yml`. The weekly run refreshes the develop docs at the
# site root, whose API reference follows Ginkgo's develop branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOXYGEN_VERSION: "1.17.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate version list
        run: python3 scripts/check_build.py --switcher _static/switcher.json

      - name: Read version list
        id: versions
        run: echo "versions=$(scripts/versions_matrix.sh _static/switcher.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - name: Checkout docs (${{ matrix.branch }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: docs

      - name: Read pinned Ginkgo ref
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < docs/.ginkgo-ref)" >> "$GITHUB_OUTPUT"

      # The example pages include `/../upstream/examples/...`, so Ginkgo
      # sits next to the docs checkout.
      - name: Checkout Ginkgo (${{ steps.pin.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: ginkgo-project/ginkgo
          ref: ${{ steps.pin.outputs.ref }}
          path: upstream

      # Ubuntu's apt Doxygen lags upstream by ~2 years (current apt is
      # 1.9.8) and stumbles on Ginkgo's template-heavy headers. The
      # upstream prebuilt Linux tarball pins a known-good version.
      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          tag="Release_${DOXYGEN_VERSION//./_}"
          url="https://github.com/doxygen/doxygen/releases/download/${tag}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -sSL "$url" -o doxygen.tar.gz
          tar xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build Doxygen XML
        run: make -C docs doxygen-xml GINKGO_SOURCE_DIR="$PWD/upstream"

      # Non-strict: a new warning from Ginkgo develop on the weekly run
      # must not take the whole site down.
      - name: Build HTML
        env:
          GINKGO_DOC_VERSION: ${{ matrix.version }}
          GINKGO_DOC_BASEURL: ${{ matrix.url }}
          GINKGO_DOC_STABLE_URL: ${{ matrix.stable_url }}
        run: sphinx-build -b html docs out

      - name: Check build
        run: python docs/scripts/check_build.py out --version "${{ matrix.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.version }}
          path: out
          retention-days: 1

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: artifacts

      - name: Assemble site
        env:
          VERSIONS: ${{ needs.plan.outputs.versions }}
        run: scripts/assemble_site.sh artifacts _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
