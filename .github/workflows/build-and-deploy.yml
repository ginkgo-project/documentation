name: Build and Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOXYGEN_VERSION: "1.17.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (stable)
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable-src

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop-src
        continue-on-error: true

      # The stable docs render API pages against Ginkgo's main branch
      # (the latest release line). The develop docs render against
      # Ginkgo's develop branch (in-flight work). Each Sphinx build
      # consumes its sibling Doxygen XML, produced from these
      # checkouts via `make doxygen-xml`.
      - name: Checkout Ginkgo source (stable → ginkgo main)
        uses: actions/checkout@v4
        with:
          repository: ginkgo-project/ginkgo
          ref: main
          path: stable-src/upstream

      - name: Checkout Ginkgo source (develop → ginkgo develop)
        uses: actions/checkout@v4
        with:
          repository: ginkgo-project/ginkgo
          ref: develop
          path: develop-src/upstream
        continue-on-error: true

      # Ubuntu's apt Doxygen lags upstream by ~2 years (current apt is
      # 1.9.8) and stumbles on Ginkgo's template-heavy headers. The
      # upstream prebuilt Linux tarball pins a known-good version.
      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          tag="Release_${DOXYGEN_VERSION//./_}"
          url="https://github.com/doxygen/doxygen/releases/download/${tag}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -sSL "$url" -o doxygen.tar.gz
          tar xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (stable)
        working-directory: stable-src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Doxygen XML (stable)
        working-directory: stable-src
        run: make doxygen-xml GINKGO_SOURCE_DIR=$PWD/upstream

      - name: Build stable
        working-directory: stable-src
        env:
          GINKGO_DOC_VERSION: stable
        run: sphinx-build -b html . ../_site

      - name: Install dependencies (develop)
        if: hashFiles('develop-src/requirements.txt') != ''
        working-directory: develop-src
        run: pip install -r requirements.txt

      - name: Build Doxygen XML (develop)
        if: hashFiles('develop-src/conf.py') != '' && hashFiles('develop-src/upstream/include/ginkgo/ginkgo.hpp') != ''
        working-directory: develop-src
        run: make doxygen-xml GINKGO_SOURCE_DIR=$PWD/upstream

      - name: Build develop
        if: hashFiles('develop-src/conf.py') != ''
        working-directory: develop-src
        env:
          GINKGO_DOC_VERSION: develop
        run: sphinx-build -b html . ../_site/develop

      - name: Copy CNAME
        run: cp stable-src/CNAME _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
