name: PR Build

# Strict build of a pull request into any version branch, against the
# Ginkgo ref pinned in the pull request's `.ginkgo-ref`.
on:
  pull_request:
    branches: [main, develop, "release/**"]

env:
  DOXYGEN_VERSION: "1.17.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs

      - name: Read pinned Ginkgo ref
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < docs/.ginkgo-ref)" >> "$GITHUB_OUTPUT"

      # The example pages include `/../upstream/examples/...`, so Ginkgo
      # sits next to the docs checkout.
      - name: Checkout Ginkgo (${{ steps.pin.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: ginkgo-project/ginkgo
          ref: ${{ steps.pin.outputs.ref }}
          path: upstream

      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          tag="Release_${DOXYGEN_VERSION//./_}"
          url="https://github.com/doxygen/doxygen/releases/download/${tag}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -sSL "$url" -o doxygen.tar.gz
          tar xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build Doxygen XML
        run: make -C docs doxygen-xml GINKGO_SOURCE_DIR="$PWD/upstream"

      - name: Strict build (warnings as errors)
        run: sphinx-build -W --keep-going -b html docs out

      - name: Check build
        run: python docs/scripts/check_build.py out

      - name: Link check
        run: sphinx-build -b linkcheck docs linkcheck
        continue-on-error: true

      - name: Upload linkcheck output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-output
          path: linkcheck/
          retention-days: 14
