{# Custom two-version switcher: stable ↔ develop #}
<div class="ginkgo-version-switcher">
  <button type="button" class="ginkgo-version-button">
    {{ ginkgo_doc_version_label }} &#9662;
  </button>
  <div class="ginkgo-version-menu">
    <a href="https://gko-project.org/" class="ginkgo-version-item {% if ginkgo_doc_version == 'stable' %}is-current{% endif %}">
      stable
    </a>
    <a href="https://gko-project.org/develop/" class="ginkgo-version-item {% if ginkgo_doc_version == 'develop' %}is-current{% endif %}">
      develop
    </a>
  </div>
</div>
